name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: 'AIzaSyBCfPhTmBootcnfVdaHvXs8bA9FLzKhah8'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'proofround.firebaseapp.com'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'proofround'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'proofround.firebasestorage.app'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '847272395699'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:847272395699:web:8b45309a61e537179fc1c6'
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: 'G-4Q4CMZ2EWG'
          NEXT_PUBLIC_STRIPE_CONNECT_BACKEND_URL: 'https://api.proofround.com/stripe/connect'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_51TW7mp2K9mbY6SbUlb2lIWe6Te68MBVz4TVJrffhvBQGieC8xcRwdflLeKPXEOMsmUyyT0ZRDAGfMxnQvAq2lQwL00YsmGEk1x'
          NEXT_PUBLIC_VERIFIED_PACKET_GENERATE_URL: 'https://api.proofround.com/packets/generate'
          NEXT_PUBLIC_VERIFIED_PACKET_REQUEST_URL: 'https://api.proofround.com/packets/request'
          NEXT_PUBLIC_VERIFIED_PACKET_PRICE_USD: '49'
          NEXT_PUBLIC_SITE_URL: 'https://proofround.com'
          FRONTEND_BASE_URL: 'https://proofround.com'
          BACKEND_BASE_URL: 'https://api.proofround.com'
          NEXT_PUBLIC_BACKEND_BASE_URL: 'https://api.proofround.com'
          NEXT_PUBLIC_VERCEL_ANALYTICS_ENDPOINT: 'https://api.proofround.com/_vercel/insights'
          NEXT_PUBLIC_VERCEL_ANALYTICS_SCRIPT_SRC: 'https://va.vercel-scripts.com/v1/script.js'
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION || vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_BING_SITE_VERIFICATION || vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

